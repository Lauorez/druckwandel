version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      # Muss zusammen mit der Cargo-Gruppe "tauri" aktualisiert werden.
      tauri:
        patterns:
          - "@tauri-apps/*"
      npm:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      # Muss zusammen mit der npm-Gruppe "tauri" aktualisiert werden.
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
      cargo:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directory: /drucker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: Microsoft.Windows.SDK.BuildTools
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      nuget:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
