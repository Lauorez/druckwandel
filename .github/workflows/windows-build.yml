name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build signed MSIX package
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Smoke-test install, print pipeline, and uninstall
        continue-on-error: true
        shell: pwsh
        run: ./scripts/smoke-install.ps1 -TestPrint
      - name: Upload development package
        uses: actions/upload-artifact@v7
        with:
          name: erechnung-virtual-printer-x64
          path: |
            artifacts/packages/**/*.msix
            artifacts/smoke/**
            .cert/ERechnung.Dev.cer
          if-no-files-found: error
