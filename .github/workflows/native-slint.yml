name: Rust-Slint-App

on:
  workflow_dispatch:
    inputs:
      package:
        description: Installer als Entwicklungsartefakte bauen
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: 'true'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p druckwandel-native --all-targets --locked -- -D warnings
      - run: cargo test -p druckwandel-native --locked
      - name: Lokale Windows-OCR bereitstellen und Scans prüfen
        if: runner.os == 'Windows'
        run: |
          python scripts/fetch-ocr.py
          cargo test -p druckwandel-native --locked --test ocr -- --ignored
      - name: Download-Regressionen prüfen
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Offline-Prüfer laden
        run: python scripts/fetch-validators.py
      - name: XML- und PDF-Ausgaben unabhängig prüfen
        run: cargo test -p druckwandel-native --locked --test external_validators -- --ignored
      - name: .NET für Windows-Drucker bereitstellen
        if: runner.os == 'Windows' && inputs.package
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Windows-Installer (App + Drucker) bauen
        if: runner.os == 'Windows' && inputs.package
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) {throw 'NSIS-Installation fehlgeschlagen.'}
          ./scripts/build-windows-installer.ps1 -SkipChecks
      - name: Installer-Protokollregistrierung prüfen
        if: runner.os == 'Windows' && inputs.package
        shell: pwsh
        run: ./scripts/test-native-installer.ps1
      - name: macOS-App und DMG bauen
        if: runner.os == 'macOS' && inputs.package
        run: sh scripts/build-macos-installer.sh
      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: Druckwandel-Slint-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/windows/Druckwandel-*-Setup.exe
            artifacts/windows/Druckwandel-*-Setup.exe.sha256
            artifacts/macos/*.dmg
            artifacts/macos/*.dmg.sha256
          if-no-files-found: error
