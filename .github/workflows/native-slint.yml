name: Rust-Slint-App

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/native/**"
      - ".github/workflows/native-slint.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/native/**"
      - ".github/workflows/native-slint.yml"

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p druckwandel-native --all-targets --locked -- -D warnings
      - run: cargo test -p druckwandel-native --locked
