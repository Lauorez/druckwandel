name: Release-Gate

# Portable run on GitHub-hosted Ubuntu. Windows Cargo, .NET, the installer and
# the real validators stay local (`npm run release:gate`). Neither a Windows runner
# nor the DATEV checker counts as passed here.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run release:gate -- --portable
      - name: Gate-Bericht
        if: always()
        run: node -e "console.log(require('fs').readFileSync('artifacts/release-gate.json','utf8'))"
