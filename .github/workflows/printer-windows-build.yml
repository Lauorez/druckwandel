name: Printer Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drucker/**"
      - ".github/workflows/printer-windows-build.yml"
  pull_request:
    paths:
      - "drucker/**"
      - ".github/workflows/printer-windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: drucker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build signed MSIX package
        run: ./scripts/build.ps1
      - name: Build interactive print smoke sender
        run: dotnet build tests/PrintSmokeSender/PrintSmokeSender.csproj --configuration Release
      - name: Smoke-test install, printer registration, and uninstall
        run: ./scripts/smoke-install.ps1
      - name: Collect Windows diagnostics
        if: always()
        run: ./scripts/collect-diagnostics.ps1 -EventLookbackMinutes 10
      - name: Upload development package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: erechnung-virtual-printer-x64
          path: |
            drucker/artifacts/packages/**/*.msix
            drucker/artifacts/diagnostics/**
            drucker/.cert/ERechnung.Dev.cer
          if-no-files-found: error
