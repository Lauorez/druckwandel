name: Printer core tests

on:
  push:
    branches: [main]
    paths:
      - "drucker/**"
      - ".github/workflows/printer-core-tests.yml"
  pull_request:
    paths:
      - "drucker/**"
      - ".github/workflows/printer-core-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drucker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/PrintCore.Tests/PrintCore.Tests.csproj --configuration Release
