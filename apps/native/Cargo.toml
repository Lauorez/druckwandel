[package]
name = "druckwandel-native"
version = "0.4.0-dev"
edition = "2024"
license = "MIT"
publish = false
build = "build.rs"
default-run = "druckwandel-native"

[dependencies]
dirs = "6"
dunce = "1.0.5"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
lopdf = { version = "=0.38.0", default-features = false }
pdf-extract = "=0.10.0"
regex = "1"
rfd = "0.15"
robius-share = "=0.3.0"
roxmltree = "0.21"
rust_decimal = { version = "1", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "=1.16.0", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "accessibility", "compat-1-2"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "=1.16.0"
