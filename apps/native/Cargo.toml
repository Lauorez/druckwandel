[package]
name = "druckwandel-native"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false
build = "build.rs"
default-run = "druckwandel-native"

[dependencies]
dirs = "7"
dunce = "1.0.5"
ed25519-dalek = "3"
flate2 = "1"
hayro = "=0.9.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
lopdf = { version = "=0.47.0", default-features = false }
pdf-extract = "=0.12.1"
png = "0.18"
regex = "1"
rfd = "0.18"
robius-share = "=0.3.0"
roxmltree = "0.21"
rust_decimal = { version = "1", features = ["serde"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
slint = { version = "=1.16.0", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "accessibility", "compat-1-2", "unstable-winit-030"] }
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[build-dependencies]
slint-build = "=1.16.0"

[dev-dependencies]
slint = { version = "=1.16.0", default-features = false, features = ["renderer-software"] }
